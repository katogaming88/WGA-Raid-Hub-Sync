name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Started by release-please.yml on its release pull request (see there).
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build
      - run: dotnet test --no-build
